services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: land_governance_postgres

    environment:
      POSTGRES_DB: land_governance
      POSTGRES_USER: land_admin
      POSTGRES_PASSWORD: land_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: